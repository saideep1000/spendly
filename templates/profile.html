{% extends "base.html" %}

{% block title %}Your Profile — Spendly{% endblock %}

{% block content %}

<section class="auth-section">
    <div class="auth-container">

        <div class="auth-header">
            <h1 class="auth-title">Your profile</h1>
            <p class="auth-subtitle">Your account details</p>
        </div>

        <div class="auth-card">
            <div class="profile-info">
                <div class="profile-field">
                    <span class="profile-label">Name</span>
                    <span class="profile-value">{{ name }}</span>
                </div>
                <div class="profile-field">
                    <span class="profile-label">Email</span>
                    <span class="profile-value">{{ email }}</span>
                </div>
                <div class="profile-field">
                    <span class="profile-label">Member since</span>
                    <span class="profile-value">{{ member_since }}</span>
                </div>
            </div>
        </div>

    </div>
</section>

{% endblock %}
